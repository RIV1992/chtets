name: Check portable skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Validate public source
        run: python scripts/validate.py
      - name: Test portable exports and archive boundaries
        run: python -m unittest discover -s tests
      - name: Build deterministic archives and portable prompts
        run: python scripts/package.py
      - name: Check that the generated documents are current
        run: git diff --exit-code -- docs/portable-prompt.md docs/portable-prompt-extended.md docs/context-size.json
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chtets-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
